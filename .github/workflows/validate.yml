name: Validate

# HACS / Marketplace checks for a dashboard plugin: description, topics, issues,
# hacs.json, README images and the card file itself.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

site_name: HKI Parcels Card Documentation
site_description: Track parcels from PostNL, DHL, DPD, GLS, Dragonfly, Trunkrs, Cainiao and Hermes in a single Home Assistant card.
site_url: https://jonisnet.github.io/hki-parcels-card/
repo_url: https://github.com/jonisnet/hki-parcels-card
repo_name: jonisnet/hki-parcels-card
edit_uri: edit/main/docs/

# mkdocs.yml lives inside docs/ alongside the markdown source files (index.md, card/, ...)
# instead of at the repo root, so the default docs_dir ("docs", relative to this file's
# own directory) would wrongly look for docs/docs/. Point it at the current directory.
docs_dir: .
site_dir: ../site

theme:
  name: material
  icon:
    logo: material/package-variant-closed
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # base_path is resolved relative to the working directory mkdocs is invoked from.
  # Always build with `mkdocs build -f docs/mkdocs.yml` from the repo root (that's what
  # the docs.yml CI workflow does), so "." here means the repo root, where CHANGELOG.md lives.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jonisnet/hki-parcels-card
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/jonisnet

copyright: Based on jimz011/hki-elements. Maintained by jonisnet.

nav:
  - Home: index.md
  - Installation: installation.md
  - HKI Parcels Card:
      - Overview: card/overview.md
      - Basic Usage: card/basic-usage.md
      - Configuration: card/configuration.md
      - Tips & Tricks: card/tips.md
      - Examples: card/examples.md
      - Screenshots: card/screenshots.md
      - Troubleshooting: card/troubleshooting.md
  - Changelog: changelog.md
